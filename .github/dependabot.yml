version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      tooling:
        patterns: ['*']
        exclude-patterns: ['@codemirror/*', '@lezer/*', '@types/vscode']
    ignore:
      # Raising this raises the minimum supported VS Code version; do it deliberately.
      - dependency-name: '@types/vscode'
      # Must match the Node.js version of the VS Code extension host, not the latest Node.js.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
