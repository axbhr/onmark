# dev: verifies every change. Runs on pull requests and feature branches, and is reused by the
# pre-release (test) and release (prod) workflows before they publish anything.
name: CI

on:
  pull_request:
  push:
    # main/develop run CI through the release workflows; Dependabot branches through their pull requests.
    branches-ignore: [main, develop, 'dependabot/**']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Third-party notices are up to date
        run: |
          npm run notices
          git diff --exit-code THIRD_PARTY_NOTICES.md || {
            echo "::error::THIRD_PARTY_NOTICES.md is outdated. Run 'npm run package && npm run notices' and commit the result."
            exit 1
          }
      - name: Set development version
        id: version
        run: |
          version=$(node scripts/release.mjs prerelease "$GITHUB_RUN_NUMBER")
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npx vsce package --no-dependencies --pre-release --out "onmark-${{ steps.version.outputs.version }}-dev.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onmark-dev-vsix
          path: '*.vsix'
          retention-days: 14
