# prod: every push to `main` computes the next release version from Conventional Commits
# (even minor, e.g. 0.2.0). After approval in the `production` environment it is published to the
# VS Code Marketplace and Open VSX (VSCodium), tagged `v<version>` and released on GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Next version
        id: next
        run: |
          version=$(node scripts/release.mjs next-release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "::notice::No user-facing changes (feat, fix, perf, revert, breaking) since the last release."
          else
            echo "### Next release: ${version}" >> "$GITHUB_STEP_SUMMARY"
            node scripts/release.mjs notes "$version" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketplace.visualstudio.com/items?itemName=axbhr.onmark
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version and changelog
        run: |
          npm version "$VERSION" --no-git-tag-version
          node scripts/release.mjs changelog "$VERSION" > CHANGELOG.md
          node scripts/release.mjs notes "$VERSION" > notes.md
      - run: npx vsce package --no-dependencies --out "onmark-$VERSION.vsix"
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "onmark-$VERSION.vsix" --skip-duplicate
      - name: Publish to Open VSX (VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "onmark-$VERSION.vsix" --skip-duplicate
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "onmark-$VERSION.vsix" \
            --target "$GITHUB_SHA" --title "Onmark $VERSION" --notes-file notes.md
