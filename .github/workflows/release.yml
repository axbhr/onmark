# prod: every push to `main` computes the next release version from Conventional Commits
# (even minor, e.g. 0.2.0). After approval in the `production` environment it is published to the
# VS Code Marketplace and Open VSX (VSCodium), tagged `v<version>` and released on GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Next version
        id: next
        run: |
          version=$(node scripts/release.mjs next-release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "::notice::No user-facing changes (feat, fix, perf, revert, breaking) since the last release."
          else
            echo "### Next release: ${version}" >> "$GITHUB_STEP_SUMMARY"
            node scripts/release.mjs notes "$version" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://marketplace.visualstudio.com/items?itemName=axbhr.onmark
    permissions:
      contents: write # create the tag and GitHub release
      id-token: write # sign the build provenance
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set version and changelog
        run: |
          npm version "$VERSION" --no-git-tag-version
          node scripts/release.mjs changelog "$VERSION" > CHANGELOG.md
          node scripts/release.mjs notes "$VERSION" > notes.md
      - run: npx vsce package --no-dependencies --out "onmark-$VERSION.vsix"
      - name: Checksum
        run: sha256sum "onmark-$VERSION.vsix" > "onmark-$VERSION.vsix.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: onmark-${{ needs.plan.outputs.version }}.vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "onmark-$VERSION.vsix" --skip-duplicate
      - name: Publish to Open VSX (VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "onmark-$VERSION.vsix" --skip-duplicate
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "onmark-$VERSION.vsix" "onmark-$VERSION.vsix.sha256" \
            --target "$GITHUB_SHA" --title "Onmark $VERSION" --notes-file notes.md
